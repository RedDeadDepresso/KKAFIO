name: Build and Release KKAFIO

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "main"
    paths:
      - ".github/workflows/build.yml"
      - "*.py"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/build.yml"
      - "*.py"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

# ── Meta job ─────────────────────────────────────────────────────────────────
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} 2>/dev/null || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
              | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release); then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi

          echo "tag=$tag"               | tee -a $GITHUB_OUTPUT
          echo "is_release=$is_release" | tee -a $GITHUB_OUTPUT
          echo "is_prerelease=$is_prerelease" | tee -a $GITHUB_OUTPUT

      - id: mxu-latest-release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: RedDeadDepresso/MXU-KKAFIO
          excludes: >-
            ${{ (steps.set_tag.outputs.is_release == 'true' &&
                 steps.set_tag.outputs.is_prerelease == 'false')
                && 'prerelease, draft' || 'draft' }}
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      mxu_version: ${{ steps.mxu-latest-release.outputs.release }}

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    needs: meta
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python / uv ────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-dev --group build

      # ── Check the GUI toolkit used by password_dialog / llm_dialog ─────────
      # The dialogs need tkinter (Tcl/Tk) from the Python build plus
      # customtkinter. Fail early here instead of shipping an exe whose
      # dialogs silently fall back to the terminal prompt.
      - name: Check tkinter and customtkinter are importable
        shell: pwsh
        run: |
          uv run python -c "import tkinter, customtkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel')); print('customtkinter', customtkinter.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "tkinter and/or customtkinter cannot be imported. The dialogs need a Python build that includes tkinter."
          }

      # ── Download MXU ────────────────────────────────────────────────────────
      - name: Download MXU (win-${{ matrix.arch }})
        uses: robinraju/release-downloader@v1
        with:
          repository: RedDeadDepresso/MXU-KKAFIO
          fileName: "*win-${{ matrix.arch }}*"
          tag: ${{ needs.meta.outputs.mxu_version }}
          out-file-path: "downloads/MXU"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Build kkafio_cli.exe ────────────────────────────────────────────────
      - name: Build kkafio_cli.exe
        run: >
          uv run pyinstaller --noconfirm --onedir
          --distpath "dist"
          --name "KKAFIO"
          --paths "src"
          --collect-submodules "kkafio"
          --collect-data "customtkinter"
          kkafio_cli.py

      # ── Verify the dialogs' GUI pieces made it into the bundle ──────────────
      # PyInstaller normally collects _tkinter, the Tcl/Tk DLLs and
      # customtkinter's theme assets by itself. If a future Python/PyInstaller
      # change stops that, fail here. (If it ever does, copy the missing files
      # from base_prefix\DLLs the same way the "Copy SSL DLLs" step does.)
      # The DLL names depend on the Tcl/Tk major version the Python build uses:
      #   Tcl/Tk 8.6: tcl86t.dll + tk86t.dll
      #   Tcl/Tk 9.0: tcl90.dll  + tcl9tk90.dll   (uv's Python 3.14 uses this)
      - name: Verify tkinter and customtkinter are bundled
        shell: pwsh
        run: |
          $bundle = "dist\KKAFIO\_internal"
          # Each component lists the file-name patterns that satisfy it.
          $required = [ordered]@{
            "_tkinter extension"  = @("_tkinter*.pyd")
            "Tcl library (DLL)"   = @("tcl8?t.dll", "tcl9?.dll")
            "Tk library (DLL)"    = @("tk8?t.dll", "tcl9tk9?.dll", "*tk*.dll")
            "customtkinter theme" = @("blue.json")
          }
          $missing = @()
          foreach ($entry in $required.GetEnumerator()) {
            $hit = $null
            foreach ($pattern in $entry.Value) {
              $hit = Get-ChildItem -Path $bundle -Recurse -File -Filter $pattern | Select-Object -First 1
              if ($hit) { break }
            }
            if ($hit) {
              Write-Host "OK      $($entry.Key): $($hit.FullName)"
            } else {
              Write-Host "MISSING $($entry.Key) (tried: $($entry.Value -join ', '))"
              $missing += $entry.Key
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Files in the bundle whose name mentions tcl or tk:"
            Get-ChildItem -Path $bundle -Recurse -File |
              Where-Object { $_.Name -match 'tcl|tk' } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Bundle is missing GUI components for the password/LLM dialogs: $($missing -join ', ')"
          }

      # ── Assemble release folder ─────────────────────────────────────────────
      - name: Assemble release folder
        shell: pwsh
        run: |
          $dst = "dist\KKAFIO"

          # interface.json — patch version field with the release tag
          if (Test-Path "interface.json") {
            $iface = Get-Content "interface.json" -Raw | ConvertFrom-Json
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^v', ''
            $iface.version = $ver
            $iface | ConvertTo-Json -Depth 10 | Set-Content "$dst\interface.json" -Encoding UTF8
          }

          # assets/ (icon, modpack indexes, colour data, i18n)
          if (Test-Path "assets") { Copy-Item "assets" "$dst\assets" -Recurse -Force }

          # scripts/ (helper scripts added under scripts/)
          if (Test-Path "scripts") { Copy-Item "scripts" "$dst\scripts" -Recurse -Force }

          # kkafio_setup.bat
          if (Test-Path "kkafio_setup.bat")   { Copy-Item "kkafio_setup.bat"   $dst }

          # README.md
          if (Test-Path "README.md")   { Copy-Item "README.md"   $dst }

          # CHANGELOG.md
          if (Test-Path "CHANGELOG.md") { Copy-Item "CHANGELOG.md" $dst }

          # LICENSE
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   $dst }

          # Install MXU → rename to KKAFIO.exe
          $mxuDir = "downloads\MXU"
          $mxuExe = Get-ChildItem -Path $mxuDir -Filter "mxu.exe" -Recurse | Select-Object -First 1
          if ($mxuExe) {
            # Note: PyInstaller already created KKAFIO.exe (the CLI), 
            # so we rename the CLI to kkafio_cli.exe to make room for the GUI.
            Rename-Item "$dst\KKAFIO.exe" "kkafio_cli.exe"
            Copy-Item $mxuExe.FullName "$dst\KKAFIO.exe"
            Write-Host "MXU installed as KKAFIO.exe, CLI moved to kkafio_cli.exe"
          }

      # ── Copy SSL DLLs ───────────────────────────────────────────────────
      - name: Copy SSL DLLs
        shell: pwsh
        run: |
          $dlls     = (uv run python -c "import sys; print(sys.base_prefix)") + "\DLLs"
          $internal = "dist\KKAFIO\_internal"
          $root     = "dist\KKAFIO"

          foreach ($target in @($internal, $root)) {
            Copy-Item "$dlls\_ssl.pyd"            $target -Force
            Copy-Item "$dlls\libcrypto-3-x64.dll" $target -Force
            Copy-Item "$dlls\libssl-3-x64.dll"    $target -Force
          }

      # ── Convert icon ────────────────────────────────────────────────────
      - name: Convert icon.png to kkafio.ico
        shell: bash
        run: |
          # Check if icon exists before running
          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png not found!"
            exit 1
          fi

          # Use the correct path to the icon
          for size in 512 256 128 64 48 32 24 16; do
            magick "assets/icon.png" -resize ${size}x${size} "icon-${size}.png"
          done

          magick icon-512.png icon-256.png icon-128.png icon-64.png icon-48.png \
                 icon-32.png icon-24.png icon-16.png kkafio.ico

      # ── Patch renamed executable ────────────────────────────────────────
      - name: Patch KKAFIO.exe icon and metadata
        shell: bash
        run: |
          curl -sL https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe
          EXE="dist/KKAFIO/KKAFIO.exe"

          if [[ -f "$EXE" ]]; then
            ./rcedit.exe "$EXE" \
              --set-icon "kkafio.ico" \
              --set-version-string "ProductName"      "KKAFIO" \
              --set-version-string "FileDescription"  "KKAFIO - Koikatsu Auto File I/O" \
              --set-version-string "CompanyName"      "KKAFIO" \
              --set-version-string "InternalName"     "KKAFIO" \
              --set-version-string "OriginalFilename" "KKAFIO.exe"
          else
            echo "WARNING: KKAFIO.exe not found"
          fi

      # ── Zip ─────────────────────────────────────────────────────────────
      - name: Zip release
        shell: pwsh
        run: |
          $tag  = "${{ needs.meta.outputs.tag }}"
          $arch = "${{ matrix.arch }}"
          $name = "KKAFIO-win-$arch-$tag.zip"
          Compress-Archive -Path "dist\KKAFIO\*" -DestinationPath $name
          Write-Host "Created: $name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKAFIO-win-${{ matrix.arch }}-zip
          path: KKAFIO-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.zip
          retention-days: 30

  # ── Release ────────────────────────────────────────────────────────────────────
  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KKAFIO-win-*-zip
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}