name: Build KKAFIO

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (no dev)
        run: uv sync --no-dev --group build

      # ── Build kkafio_cli.exe ─────────────────────────────────────────────────
      - name: Build kkafio_cli.exe
        run: >
          uv run pyinstaller --noconfirm --onedir
          --name "kkafio_cli"
          --hidden-import "util.config"
          --hidden-import "util.logger"
          --hidden-import "util.file_manager"
          --hidden-import "util.classifier"
          --hidden-import "modules.install_chara"
          --hidden-import "modules.remove_chara"
          --hidden-import "modules.fc_kks"
          --hidden-import "modules.create_backup"
          --hidden-import "modules.filter_duplicates"
          --hidden-import "modules.group_chara"
          --hidden-import "modules.ungroup_chara"
          --hidden-import "modules.archive_chara"
          --hidden-import "modules.delete_chara"
          --hidden-import "kkloader"
          --hidden-import "kkloader.KoikatuCharaData"
          --hidden-import "msgpack"
          --hidden-import "send2trash"
          --hidden-import "xml.etree.ElementTree"
          kkafio_cli.py

      # ── Build KKAFIO.exe ────────────────────────────────────────────────────
      - name: Build KKAFIO.exe
        run: >
          uv run pyinstaller --noconfirm --onedir --windowed
          --name "KKAFIO"
          --icon "app/resource/images/logo.ico"
          --add-data "app/resource;app/resource"
          --collect-data "qfluentwidgets"
          --collect-data "certifi"
          --copy-metadata "kkafio"
          --hidden-import "PySide6.QtSvg"
          --hidden-import "qfluentwidgets"
          --hidden-import "psutil"
          KKAFIO.py

      # ── Assemble final dist folder ──────────────────────────────────────────
      - name: Assemble release folder
        shell: pwsh
        run: |
          Copy-Item "dist\kkafio_cli\kkafio_cli.exe" "dist\KKAFIO\kkafio_cli.exe"
          Copy-Item -Recurse -Force `
            "dist\kkafio_cli\_internal\*" `
            "dist\KKAFIO\_internal\"
          Copy-Item "register_context_menu.bat"   "dist\KKAFIO\register_context_menu.bat"
          Copy-Item "unregister_context_menu.bat" "dist\KKAFIO\unregister_context_menu.bat"
          Copy-Item "kkafio_archive.bat"            "dist\KKAFIO\kkafio_archive.bat"
          Copy-Item "kkafio_delete.bat"             "dist\KKAFIO\kkafio_delete.bat"
          Copy-Item "README.md"                     "dist\KKAFIO\README.md"

      # ── Copy SSL DLLs AFTER assemble so they are not overwritten ────────────
      - name: Copy SSL DLLs
        shell: pwsh
        run: |
          $dlls = (uv run python -c "import sys; print(sys.base_prefix)") + "\DLLs"
          $internal = "dist\KKAFIO\_internal"
          $root     = "dist\KKAFIO"
          foreach ($target in @($internal, $root)) {
            Copy-Item "$dlls\_ssl.pyd"             $target -Force
            Copy-Item "$dlls\libcrypto-3-x64.dll"  $target -Force
            Copy-Item "$dlls\libssl-3-x64.dll"     $target -Force
          }

      # ── Verify SSL DLLs are present ─────────────────────────────────────────
      - name: Verify SSL DLLs
        shell: pwsh
        run: |
          @(
            "dist\KKAFIO\_internal\_ssl.pyd",
            "dist\KKAFIO\_internal\libcrypto-3-x64.dll",
            "dist\KKAFIO\_internal\libssl-3-x64.dll",
            "dist\KKAFIO\_ssl.pyd",
            "dist\KKAFIO\libcrypto-3-x64.dll",
            "dist\KKAFIO\libssl-3-x64.dll"
          ) | ForEach-Object {
            if (Test-Path $_) {
              Write-Host "OK: $_"
            } else {
              Write-Error "MISSING: $_"
            }
          }

      # ── Zip the release ─────────────────────────────────────────────────────
      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path "dist\KKAFIO\*" -DestinationPath "KKAFIO-${{ github.ref_name }}.zip"

      # ── Upload artifact (available on every run, not just tagged releases) ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKAFIO-${{ github.ref_name }}
          path: KKAFIO-${{ github.ref_name }}.zip
          retention-days: 30

      # ── Create GitHub Release (only on version tags) ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KKAFIO-${{ github.ref_name }}.zip
          generate_release_notes: true